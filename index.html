<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Quest — Interactive Trivia & Knowledge Challenge</title>
    <meta name="description" content="An interactive quiz quest game featuring dynamic trivia categories, score tracking, time challenges, and scoreboards.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none">

    <!-- Navbar -->
    <header class="max-w-3xl w-full mx-auto flex justify-between items-center bg-slate-900/80 backdrop-blur-md px-6 py-4 rounded-2xl border border-slate-800 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-300">Quiz Quest</h1>
        </div>
        <div class="flex items-center gap-4 text-sm font-semibold">
            <div class="bg-slate-800/80 px-4 py-1.5 rounded-xl border border-slate-700">
                Score: <span id="scoreDisplay" class="text-indigo-400 font-extrabold text-base">0</span>
            </div>
        </div>
    </header>

    <!-- Quiz Box -->
    <main class="max-w-3xl w-full mx-auto my-auto py-6">
        
        <!-- Start Screen -->
        <div id="startScreen" class="bg-slate-900/60 backdrop-blur-xl p-8 sm:p-10 rounded-3xl border border-slate-800 text-center shadow-2xl space-y-6">
            <div class="w-20 h-20 bg-indigo-500/20 text-indigo-400 rounded-3xl mx-auto flex items-center justify-center text-4xl border border-indigo-500/30 shadow-2xl">
                ⚔️
            </div>
            <h2 class="text-3xl font-extrabold text-white">Welcome to Quiz Quest</h2>
            <p class="text-slate-400 max-w-md mx-auto text-base">Test your knowledge across software development, web technology, and science trivia in a timed challenge!</p>
            
            <button id="startQuizBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 px-10 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-95 transition text-lg inline-flex items-center gap-3">
                <span>Start Quest</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- Question Screen -->
        <div id="quizScreen" class="hidden bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            <div class="flex justify-between items-center text-sm text-slate-400 border-b border-slate-800 pb-4">
                <span id="questionNum">Question 1 of 5</span>
                <div class="flex items-center gap-2 text-amber-400 font-bold">
                    <i class="fas fa-clock"></i> <span id="timeLeft">15</span>s
                </div>
            </div>

            <h3 id="questionText" class="text-xl sm:text-2xl font-bold text-white leading-relaxed">Loading Question...</h3>

            <!-- Options Grid -->
            <div id="optionsContainer" class="grid grid-cols-1 gap-3 pt-2"></div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="hidden bg-slate-900/80 backdrop-blur-xl p-8 sm:p-10 rounded-3xl border border-slate-800 text-center shadow-2xl space-y-6">
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-3xl mx-auto flex items-center justify-center text-4xl border border-emerald-500/30">
                🏆
            </div>
            <h2 class="text-3xl font-extrabold text-white">Quest Completed!</h2>
            <p id="finalScoreText" class="text-xl text-slate-300">You scored <span class="text-emerald-400 font-bold">400</span> points!</p>
            
            <button id="restartQuizBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-95 transition text-base inline-flex items-center gap-2">
                <i class="fas fa-redo"></i> Play Again
            </button>
        </div>

    </main>

    <footer class="max-w-3xl w-full mx-auto text-center text-xs text-slate-500 py-3">
        &copy; 2026 Quiz Quest — Created by <a href="https://github.com/Worstace01" target="_blank" class="underline hover:text-slate-300">Andrie Deuna</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
